[pytest]
testpaths = .
python_files = test_*.py
addopts = --strict-markers --html=html_report/report.html
markers =
	parquet_data: integration checks for the Parquet data pipeline
	smoke: fast check that a dataset is readable and non-empty
	example: local examples for the reusable DQ library
	facility_name_min_time_spent_per_visit_date: checks for this Parquet dataset
	facility_type_avg_time_spent_per_visit_date: checks for this Parquet dataset
	patient_sum_treatment_cost_per_facility_type: checks for this Parquet dataset
